theme: jekyll-theme-slate
title: Matteo Tosi
github:
  is_project_page: false
defaults:
  - scope:
      path: "blog"
      type: pages
    values:
      permalink: "/blog/:basename.html"
exclude:
  - scripts
  - test
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/